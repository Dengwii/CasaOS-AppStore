name: zimaos-e2e-command-local-empty-upstream-value-composite
services:
  web:
    image: traefik/whoami:v1.10.3
    container_name: zimaos-e2e-command-local-empty-upstream-value-composite-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260917185928-187279-update-command-local-empty-upstream-value-composite
    restart: unless-stopped
    ports:
      - target: 80
        published: '18216'
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
      - --name=baseline
  helper:
    image: alpine:3.20
    container_name: zimaos-e2e-command-local-empty-upstream-value-composite-helper
    network_mode: bridge
    restart: unless-stopped
    environment:
      E2E_SECONDARY_BASELINE: 20260917185928-187279-update-command-local-empty-upstream-value-composite
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
x-casaos:
  id: org.zimaos.e2e.command-local-empty-upstream-value-composite
  main: web
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.zimaos.e2e.command-local-empty-upstream-value-composite/assets/icon.svg
  title:
    en_US: E2E Command Local-Empty-Upstream-Value Composite
    zh_CN: E2E Command Local-Empty-Upstream-Value Composite
  port_map: '18216'
  version: 1.0.0
