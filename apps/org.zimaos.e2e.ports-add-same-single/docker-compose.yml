name: zimaos-e2e-ports-add-same-single
services:
  web:
    image: traefik/whoami:v1.10.3
    container_name: zimaos-e2e-ports-add-same-single-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260917140034-116715-update-ports-add-same-single
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
    ports: []
x-casaos:
  id: org.zimaos.e2e.ports-add-same-single
  main: web
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.zimaos.e2e.ports-add-same-single/assets/icon.svg
  title:
    en_US: E2E Ports Add-Same Single
    zh_CN: E2E Ports Add-Same Single
  port_map: '18201'
  version: 1.0.0
