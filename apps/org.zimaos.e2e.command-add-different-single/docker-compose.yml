name: zimaos-e2e-command-add-different-single
services:
  web:
    image: traefik/whoami:v1.11.0
    container_name: zimaos-e2e-command-add-different-single-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260918055056-316649-update-command-add-different-single
    restart: unless-stopped
    ports:
      - target: 80
        published: '18203'
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
      - --name=upstream
x-casaos:
  id: org.zimaos.e2e.command-add-different-single
  main: web
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.zimaos.e2e.command-add-different-single/assets/icon.svg
  title:
    en_US: E2E Command Add-Different Single
    zh_CN: E2E Command Add-Different Single
  port_map: '18203'
  version: 1.1.0
