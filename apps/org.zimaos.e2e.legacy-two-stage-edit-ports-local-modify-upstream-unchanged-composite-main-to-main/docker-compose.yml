name: zimaos-e2e-legacy-two-stage-edit-ports-local-modify-upstream-unchanged-composite-main-to-main
services:
  web:
    image: traefik/whoami:v1.11.0
    container_name: zimaos-e2e-legacy-two-stage-edit-ports-local-modify-upstream-unchanged-composite-main-to-main-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260920102904-790322-update-legacy-two-stage-edit-ports-local-modify-upstream-unchanged-composite-main-to-main
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    ports:
      - target: 80
        published: '18205'
        protocol: tcp
      - target: 10020
        published: '30040'
        protocol: tcp
    restart: unless-stopped
    command:
      - --port=80
  helper:
    image: alpine:3.20
    container_name: zimaos-e2e-legacy-two-stage-edit-ports-local-modify-upstream-unchanged-composite-main-to-main-helper
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260920102904-790322-update-legacy-two-stage-edit-ports-local-modify-upstream-unchanged-composite-main-to-main-helper
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base-helper
        target: /e2e-base-helper
    restart: unless-stopped
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
    ports:
      - target: 10022
        published: '30044'
        protocol: tcp
