name: zimaos-e2e-native-two-stage-edit-ports-local-modify-upstream-unchanged-composite-main-to-main
services:
  web:
    image: traefik/whoami:v1.10.3
    container_name: zimaos-e2e-native-two-stage-edit-ports-local-modify-upstream-unchanged-composite-main-to-main-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260920014055-643440-update-native-two-stage-edit-ports-local-modify-upstream-unchanged-composite-main-to-main
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    ports:
      - target: 80
        published: '19980'
        protocol: tcp
      - target: 17120
        published: '44240'
        protocol: tcp
    restart: unless-stopped
    command:
      - --port=80
  helper:
    image: alpine:3.20
    container_name: zimaos-e2e-native-two-stage-edit-ports-local-modify-upstream-unchanged-composite-main-to-main-helper
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260920014055-643440-update-native-two-stage-edit-ports-local-modify-upstream-unchanged-composite-main-to-main-helper
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base-helper
        target: /e2e-base-helper
    restart: unless-stopped
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
    ports:
      - target: 17122
        published: '44244'
        protocol: tcp
