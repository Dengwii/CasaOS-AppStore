name: zimaos-e2e-manage-composite
services:
  web:
    image: traefik/whoami:v1.10.3@sha256:7865582efaa90720f146cbdb411756b5e85dafcb0f608396a48c4d2d0b1218ad
    container_name: zimaos-e2e-manage-composite-web
    restart: unless-stopped
    ports:
      - target: 80
        published: '18104'
        protocol: tcp
    environment:
      ZIMAOS_E2E_BASELINE: 20260921215814-1252718-manage-composite
      E2E_SHARED: baseline
      E2E_LOCAL_DELETE_UPSTREAM_MODIFY: baseline
      E2E_LOCAL_KEEP_UPSTREAM_DELETE: baseline
      E2E_LOCAL_EMPTY_UPSTREAM_VALUE: baseline
      E2E_LOCAL_VALUE_UPSTREAM_EMPTY: baseline
      E2E_BOTH_EMPTY: baseline
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
  helper:
    image: alpine:3.20@sha256:45e09956dc667c5eff3583c9d94830261fb1ca0be10a0a7db36266edf5de9e1d
    container_name: zimaos-e2e-manage-composite-helper
    restart: unless-stopped
    environment:
      E2E_SECONDARY_BASELINE: 20260921215814-1252718-manage-composite
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
x-casaos:
  id: org.zimaos.e2e.manage-composite
  main: web
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.zimaos.e2e.manage-composite/assets/icon.svg
  title:
    en_US: E2E Manage Composite
    zh_CN: E2E Manage Composite
  port_map: '18104'
  version: 1.0.0
  scheme: http
  index: /
