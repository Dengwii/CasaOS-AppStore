name: zimaos-e2e-update-list-fixed-same-versionless
services:
  web:
    image: traefik/whoami:v1.10.3
    container_name: zimaos-e2e-update-list-fixed-same-versionless-web
    restart: unless-stopped
    ports:
      - target: 80
        published: '18110'
        protocol: tcp
    environment:
      ZIMAOS_E2E_BASELINE: 20261001142714-904026-update-list-fixed-same-versionless
      E2E_SHARED: baseline
      E2E_LOCAL_DELETE_UPSTREAM_MODIFY: baseline
      E2E_LOCAL_KEEP_UPSTREAM_DELETE: baseline
      E2E_LOCAL_EMPTY_UPSTREAM_VALUE: baseline
      E2E_LOCAL_VALUE_UPSTREAM_EMPTY: baseline
      E2E_BOTH_EMPTY: baseline
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
x-casaos:
  id: org.zimaos.e2e.update-list-fixed-same-versionless
  main: web
  icon: https://raw.githubusercontent.com/Dengwii/CasaOS-AppStore/refs/heads/gh-pages/apps/org.zimaos.e2e.update-list-fixed-same-versionless/assets/icon.svg
  title:
    en_US: E2E Update List Fixed Same Versionless
    zh_CN: E2E Update List Fixed Same Versionless
  port_map: '18110'
  version: 1.0.0
  scheme: http
  index: /
