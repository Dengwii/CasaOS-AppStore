name: transmission
services:
  transmission:
    environment:
      PASS: casaos
      PEERPORT: "51413"
      PGID: "1000"
      PUID: "1000"
      TZ: Europe/London
      USER: casaos
      ZIMAOS_E2E_UPGRADE_MARKER: zimaos-e2e-20260915072700-transmission
    image: linuxserver/transmission:4.1.3@sha256:a9667a6d20bbdf57a581d06d0dba98f1dac2f0e9909ef0bd1e14fa68fd6cf737
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: bridge
    ports:
      - target: 9091
        published: "9091"
        protocol: tcp
      - target: 51413
        published: "51413"
        protocol: tcp
      - target: 51413
        published: "51413"
        protocol: UDP
      - target: 9091
        published: "19091"
        protocol: tcp
    command: []
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/Downloads
        target: /downloads
      - type: bind
        source: /DATA/Downloads/watch
        target: /watch
      - type: bind
        source: /DATA/AppData/$AppID/e2e-upgrade
        target: /zimaos-e2e-upgrade/transmission
    container_name: transmission
x-casaos:
  id: org.icewhale.transmission
  main: transmission
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.icewhale.transmission/assets/icon.svg
  title:
    en_US: Transmission
  index: /
  port_map: "9091"
  version: "4.1.3"
