name: ddns-go
services:
  ddns-go:
    image: jeessy/ddns-go:v6.17.7@sha256:a75b9f2105286d9ea4d313927499dfba374bb98ad8140cef073f953067edb7dd
    network_mode: bridge
    deploy:
      resources:
        reservations:
          memory: "32M"
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /root
    ports:
      - target: 9876
        published: "9876"
        protocol: tcp
    container_name: ddns-go
x-casaos:
  id: org.icewhale.ddnsgo
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.icewhale.ddnsgo/assets/icon.svg
  main: ddns-go
  port_map: "9876"
  scheme: http
  title:
    en_US: ddns-go
  version: "6.17.7"
