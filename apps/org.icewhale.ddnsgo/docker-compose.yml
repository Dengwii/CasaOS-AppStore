name: ddns-go
services:
  ddns-go:
    image: jeessy/ddns-go:v6.17.7
    environment:
      ZIMAOS_E2E_UPGRADE_MARKER: zimaos-e2e-20260915072700-ddns-go
    network_mode: bridge
    deploy:
      resources:
        reservations:
          memory: "32M"
    command:
      - -l
      - :9876
      - -f
      - "300"
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /root
      - type: bind
        source: /DATA/AppData/$AppID/e2e-upgrade
        target: /zimaos-e2e-upgrade/ddns-go
    ports:
      - target: 9876
        published: "9876"
        protocol: tcp
      - target: 9876
        published: "19876"
        protocol: tcp
    container_name: ddns-go
x-casaos:
  id: org.icewhale.ddnsgo
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.icewhale.ddnsgo/assets/icon.svg
  main: ddns-go
  port_map: "9876"
  scheme: http
  title:
    en_US: ddns-go
  version: "6.17.7"
