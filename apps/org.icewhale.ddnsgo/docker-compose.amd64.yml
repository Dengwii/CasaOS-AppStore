name: ddns-go
services:
  ddns-go:
    image: jeessy/ddns-go:v6.17.3@sha256:204f01596f17a7ea90f57d9478ab798d33eeb69ef26644f707583303127acc42
    network_mode: bridge
    deploy:
      resources:
        reservations:
          memory: "32M"
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /root
    ports:
      - target: 9876
        published: "9876"
        protocol: tcp
    container_name: ddns-go
x-casaos:
  id: org.icewhale.ddnsgo
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.icewhale.ddnsgo/assets/icon.svg
  main: ddns-go
  port_map: "9876"
  scheme: http
  title:
    en_US: ddns-go
  version: "6.17.3"
