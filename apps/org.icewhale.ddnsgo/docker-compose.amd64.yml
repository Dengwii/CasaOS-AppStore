name: ddns-go
services:
  ddns-go:
    image: jeessy/ddns-go:v6.17.4@sha256:0aff42b1f1de0098dbaf83a289bbc1cbcc2cc1557694f8a7fe5e3805caa2e1a3
    network_mode: bridge
    deploy:
      resources:
        reservations:
          memory: "32M"
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /root
      - type: bind
        source: /DATA/AppData/
        target: /11
    ports:
      - target: 9876
        published: "9876"
        protocol: tcp
      - target: 19876
        published: "19876"
        protocol: tcp
    container_name: ddns-go
x-casaos:
  id: org.icewhale.ddnsgo
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.icewhale.ddnsgo/assets/icon.svg
  main: ddns-go
  port_map: "9876"
  scheme: http
  title:
    en_US: ddns-go
  version: "6.17.4"
