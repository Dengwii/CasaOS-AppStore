name: zimaos-e2e-image-single
services:
  web:
    image: traefik/whoami:latest@sha256:7752820e8169b4ce86b8a8613b0cf401bd021928647a8e0fdf37d713920a7645
    container_name: zimaos-e2e-image-single-web
    restart: unless-stopped
    ports:
      - target: 80
        published: '18105'
        protocol: tcp
    environment:
      ZIMAOS_E2E_BASELINE: 20260924032335-1931216-image-single
      E2E_SHARED: baseline
      E2E_LOCAL_DELETE_UPSTREAM_MODIFY: baseline
      E2E_LOCAL_KEEP_UPSTREAM_DELETE: baseline
      E2E_LOCAL_EMPTY_UPSTREAM_VALUE: baseline
      E2E_LOCAL_VALUE_UPSTREAM_EMPTY: baseline
      E2E_BOTH_EMPTY: baseline
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
x-casaos:
  id: org.zimaos.e2e.image-single
  main: web
  icon: https://raw.githubusercontent.com/Dengwii/CasaOS-AppStore/refs/heads/gh-pages/apps/org.zimaos.e2e.image-single/assets/icon.svg
  title:
    en_US: E2E Image Single
    zh_CN: E2E Image Single
  port_map: '18105'
  version: 1.0.0
  scheme: http
  index: /
