name: zimaos-e2e-image-single
services:
  web:
    image: traefik/whoami:latest
    container_name: zimaos-e2e-image-single-web
    restart: always
    ports:
      - target: 80
        published: '18105'
        protocol: tcp
    environment:
      ZIMAOS_E2E_BASELINE: 20261001134601-892902-image-single
      E2E_SHARED: upstream-loses
      E2E_LOCAL_DELETE_UPSTREAM_MODIFY: upstream-value
      E2E_LOCAL_EMPTY_UPSTREAM_VALUE: upstream-value
      E2E_LOCAL_VALUE_UPSTREAM_EMPTY: ''
      E2E_BOTH_EMPTY: ''
      E2E_UPSTREAM_ADDED: upstream-value
      E2E_BOTH_ADD_SAME: upstream-loses
      E2E_DIFFERENT_UPSTREAM: upstream-value
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
x-casaos:
  id: org.zimaos.e2e.image-single
  main: web
  icon: https://raw.githubusercontent.com/Dengwii/CasaOS-AppStore/refs/heads/gh-pages/apps/org.zimaos.e2e.image-single/assets/icon.svg
  title:
    en_US: E2E Image Single
    zh_CN: E2E Image Single
  port_map: '18105'
  version: 1.0.0
  scheme: http
  index: /
