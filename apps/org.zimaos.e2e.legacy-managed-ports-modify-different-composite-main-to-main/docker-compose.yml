    container_name: zimaos-e2e-legacy-managed-ports-modify-different-composite-main-to-main-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260920014055-643440-update-legacy-managed-ports-modify-different-composite-main-to-main
