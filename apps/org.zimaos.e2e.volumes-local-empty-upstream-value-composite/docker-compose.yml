name: zimaos-e2e-volumes-local-empty-upstream-value-composite
services:
  web:
    image: traefik/whoami:v1.11.0
    container_name: zimaos-e2e-volumes-local-empty-upstream-value-composite-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260917144513-127766-update-volumes-local-empty-upstream-value-composite
    restart: unless-stopped
    ports:
      - target: 80
        published: '18216'
        protocol: tcp
    command:
      - --port=80
    volumes:
      - type: bind
        source: /DATA/AppData/zimaos-e2e-volumes-local-empty-upstream-value-composite/case-upstream-a
        target: /e2e-case-a
  helper:
    image: alpine:3.20
    container_name: zimaos-e2e-volumes-local-empty-upstream-value-composite-helper
    network_mode: bridge
    restart: unless-stopped
    environment:
      E2E_SECONDARY_BASELINE: 20260917144513-127766-update-volumes-local-empty-upstream-value-composite
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
x-casaos:
  id: org.zimaos.e2e.volumes-local-empty-upstream-value-composite
  main: web
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.zimaos.e2e.volumes-local-empty-upstream-value-composite/assets/icon.svg
  title:
    en_US: E2E Volumes Local-Empty-Upstream-Value Composite
    zh_CN: E2E Volumes Local-Empty-Upstream-Value Composite
  port_map: '18216'
  version: 1.1.0
