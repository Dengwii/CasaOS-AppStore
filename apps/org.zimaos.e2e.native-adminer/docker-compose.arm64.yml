name: zimaos-e2e-native-adminer
services:
  adminer:
    image: adminer:6.0.1@sha256:19e37a76b58ae9358c304c22b21b13faeccb159fec5afe76e19ac3e2e925fe3a
    deploy:
      resources:
        reservations:
          memory: 32M
    restart: always
    ports:
      - target: 8080
        published: '18080'
        protocol: tcp
      - target: 8080
        published: '28080'
        protocol: tcp
    container_name: zimaos-e2e-native-adminer
    environment:
      ZIMAOS_E2E_BASELINE: 20260916084843-143381-native-adminer-pristine
      E2E_UPSTREAM_ONLY: upstream-value
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
      - type: bind
        source: /DATA/AppData/zimaos-e2e-native-adminer/e2e-upstream
        target: /e2e-upstream
    command:
      - php
      - -d
      - memory_limit=128M
      - -S
      - '[::]:8080'
      - -t
      - /var/www/html
x-casaos:
  id: org.zimaos.e2e.native-adminer
  main: adminer
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.zimaos.e2e.native-adminer/assets/icon.svg
  title:
    en_US: ZimaOS E2E Native Adminer
    zh_CN: ZimaOS E2E Native Adminer
  port_map: '18080'
  version: 6.0.1
