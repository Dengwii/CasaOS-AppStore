name: zimaos-e2e-legacy-unmanaged-ports-local-delete-upstream-modify-composite-main-to-main
services:
  web:
    image: traefik/whoami:v1.11.0
    container_name: zimaos-e2e-legacy-unmanaged-ports-local-delete-upstream-modify-composite-main-to-main-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260920033520-673872-update-legacy-unmanaged-ports-local-delete-upstream-modify-composite-main-to-main
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    ports:
      - target: 80
        published: '18212'
        protocol: tcp
      - target: 10048
        published: '30099'
        protocol: tcp
    restart: unless-stopped
    command:
      - --port=80
  helper:
    image: alpine:3.20
    container_name: zimaos-e2e-legacy-unmanaged-ports-local-delete-upstream-modify-composite-main-to-main-helper
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260920033520-673872-update-legacy-unmanaged-ports-local-delete-upstream-modify-composite-main-to-main-helper
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base-helper
        target: /e2e-base-helper
    restart: unless-stopped
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
    ports:
      - target: 10050
        published: '30100'
        protocol: tcp
