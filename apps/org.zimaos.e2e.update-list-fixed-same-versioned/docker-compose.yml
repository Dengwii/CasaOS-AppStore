name: zimaos-e2e-update-list-fixed-same-versioned
services:
  web:
    image: traefik/whoami:v1.10.3
    container_name: zimaos-e2e-update-list-fixed-same-versioned-web
    restart: on-failure
    ports:
      - target: 80
        published: '18109'
        protocol: tcp
    environment:
      ZIMAOS_E2E_BASELINE: 20261001134601-892902-update-list-fixed-same-versioned
      E2E_SHARED: upstream-loses
      E2E_LOCAL_DELETE_UPSTREAM_MODIFY: upstream-value
      E2E_LOCAL_EMPTY_UPSTREAM_VALUE: upstream-value
      E2E_LOCAL_VALUE_UPSTREAM_EMPTY: ''
      E2E_BOTH_EMPTY: ''
      ZIMAOS_E2E_UPSTREAM: must-not-apply
      E2E_UPSTREAM_ADDED: upstream-value
      E2E_BOTH_ADD_SAME: upstream-loses
      E2E_DIFFERENT_UPSTREAM: upstream-value
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
x-casaos:
  id: org.zimaos.e2e.update-list-fixed-same-versioned
  main: web
  icon: https://raw.githubusercontent.com/Dengwii/CasaOS-AppStore/refs/heads/gh-pages/apps/org.zimaos.e2e.update-list-fixed-same-versioned/assets/icon.svg
  title:
    en_US: E2E Update List Fixed Same Versioned
    zh_CN: E2E Update List Fixed Same Versioned
  port_map: '18109'
  version: 1.1.0
  scheme: http
  index: /
