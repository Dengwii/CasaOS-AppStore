name: 2fauth
services:
  2fauth:
    image: 2fauth/2fauth:8.0.2
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: bridge
    ports:
      - target: 8000
        published: "8000"
        protocol: tcp
      - target: 8000
        published: "18000"
        protocol: tcp
    command: []
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /2fauth
      - type: bind
        source: /DATA/AppData/$AppID/e2e-upgrade
        target: /zimaos-e2e-upgrade/2fauth
    environment:
      APP_KEY: SomeRandomStringOf32CharsExactly
      ZIMAOS_E2E_UPGRADE_MARKER: zimaos-e2e-20260915072700-2fauth
    container_name: 2fauth
x-casaos:
  id: org.icewhale.2fauth
  main: 2fauth
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.icewhale.2fauth/assets/icon.svg
  title:
    en_US: 2FAuth
  index: /
  port_map: "8000"
  version: "8.0.2"
