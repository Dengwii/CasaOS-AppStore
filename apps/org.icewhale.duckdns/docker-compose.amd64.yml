name: duckdns
services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest@sha256:834e98df4ac61d9598003ea6fc1017eb74ef938bcbfe40daa3c2c01358a03b8c
    container_name: duckdns
    network_mode: host #optional
    environment:
      - PUID=1000 #optional
      - PGID=1000 #optional
      - TZ=Etc/UTC #optional
      - SUBDOMAINS=subdomain1,subdomain2
      - TOKEN=token
      - UPDATE_IP=ipv6 #optional
      - LOG_FILE=false #optional
    volumes:
      - /DATA/AppData/duckdns:/config #optional
    restart: unless-stopped

x-casaos:
  id: org.icewhale.duckdns
  main: duckdns
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.icewhale.duckdns/assets/icon.svg
  title:
    en_US: duckdns
  index: /
  version: "0.0.1"
