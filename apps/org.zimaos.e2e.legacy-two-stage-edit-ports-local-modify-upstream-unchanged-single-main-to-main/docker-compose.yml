name: zimaos-e2e-legacy-two-stage-edit-ports-local-modify-upstream-unchanged-single-main-to-main
services:
  web:
    image: traefik/whoami:v1.10.3
    container_name: zimaos-e2e-legacy-two-stage-edit-ports-local-modify-upstream-unchanged-single-main-to-main-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260920074955-749341-update-legacy-two-stage-edit-ports-local-modify-upstream-unchanged-single-main-to-main
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    ports:
      - target: 80
        published: '18204'
        protocol: tcp
      - target: 10016
        published: '30032'
        protocol: tcp
    restart: unless-stopped
    command:
      - --port=80
