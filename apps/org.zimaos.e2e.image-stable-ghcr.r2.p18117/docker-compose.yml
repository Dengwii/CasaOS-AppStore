    container_name: zimaos-e2e-image-stable-ghcr-r2-p18117-web
    restart: unless-stopped
    ports:
      - target: 8000
        published: '18117'
        protocol: tcp
    environment:
      ZIMAOS_E2E_BASELINE: 20261012102936-3076092-image-stable-ghcr
