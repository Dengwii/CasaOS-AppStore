name: zimaos-e2e-ports-modify-same-composite
services:
  web:
    image: traefik/whoami:v1.10.3
    container_name: zimaos-e2e-ports-modify-same-composite-web
    environment:
      ZIMAOS_E2E_BASELINE: 20260917110228-81839-update-ports-modify-same-composite
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
    ports:
      - target: 10044
        published: '30088'
        protocol: tcp
  helper:
    image: alpine:3.20
    container_name: zimaos-e2e-ports-modify-same-composite-helper
    restart: unless-stopped
    environment:
      E2E_SECONDARY_BASELINE: 20260917110228-81839-update-ports-modify-same-composite
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
x-casaos:
  id: org.zimaos.e2e.ports-modify-same-composite
  main: web
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.zimaos.e2e.ports-modify-same-composite/assets/icon.svg
  title:
    en_US: E2E Ports Modify-Same Composite
    zh_CN: E2E Ports Modify-Same Composite
  port_map: '18222'
  version: 1.0.0
