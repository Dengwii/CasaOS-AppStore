name: zimaos-e2e-image-composite-main-m1006084817-p18107
services:
  web:
    image: traefik/whoami:latest
    container_name: zimaos-e2e-image-composite-main-m1006084817-p18107-web
    restart: on-failure
    ports:
      - target: 80
        published: '18107'
        protocol: tcp
      - target: 8082
        published: '19106'
        protocol: tcp
    environment:
      ZIMAOS_E2E_BASELINE: 20261006085004-1865673-image-composite-main
      E2E_SHARED: upstream-loses
      E2E_LOCAL_DELETE_UPSTREAM_MODIFY: upstream-value
      E2E_LOCAL_EMPTY_UPSTREAM_VALUE: upstream-value
      E2E_LOCAL_VALUE_UPSTREAM_EMPTY: ''
      E2E_BOTH_EMPTY: ''
      ZIMAOS_E2E_UPSTREAM_LATEST: must-not-apply
      E2E_UPSTREAM_ADDED: upstream-value
      E2E_BOTH_ADD_SAME: upstream-loses
      E2E_DIFFERENT_UPSTREAM: upstream-value
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
      - type: bind
        source: /DATA/AppData/$AppID/e2e-upstream-must-not-apply
        target: /e2e-upstream-must-not-apply
    command:
      - --port=80
      - --name=upstream-must-not-apply
  helper:
    image: alpine:latest
    container_name: zimaos-e2e-image-composite-main-m1006084817-p18107-helper
    restart: always
    environment:
      E2E_SECONDARY_BASELINE: 20261006085004-1865673-image-composite-main
      E2E_SECONDARY_UPSTREAM: applied
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
