name: zimaos-e2e-upgrade-composite
services:
  web:
    image: traefik/whoami:v1.10.3@sha256:f1c59fb1677f4711290c320d288e182adad7b84326d71cf5fb883893b07cd23d
    container_name: zimaos-e2e-upgrade-composite-web
    restart: unless-stopped
    ports:
      - target: 80
        published: '18102'
        protocol: tcp
    environment:
      ZIMAOS_E2E_BASELINE: 20260917071020-40176-update-composite
      E2E_SHARED: baseline
      E2E_LOCAL_DELETE_UPSTREAM_MODIFY: baseline
      E2E_LOCAL_KEEP_UPSTREAM_DELETE: baseline
      E2E_LOCAL_EMPTY_UPSTREAM_VALUE: baseline
      E2E_LOCAL_VALUE_UPSTREAM_EMPTY: baseline
      E2E_BOTH_EMPTY: baseline
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
  helper:
    image: alpine:3.20@sha256:37753b2965043543542cd9d48cba044151052ca14fa72e6cbec4edf2a1490599
    container_name: zimaos-e2e-upgrade-composite-helper
    restart: unless-stopped
    environment:
      E2E_SECONDARY_BASELINE: 20260917071020-40176-update-composite
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
x-casaos:
  id: org.zimaos.e2e.upgrade-composite
  main: web
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.zimaos.e2e.upgrade-composite/assets/icon.svg
  title:
    en_US: E2E Upgrade Composite
    zh_CN: E2E Upgrade Composite
  port_map: '18102'
  version: 1.0.0
