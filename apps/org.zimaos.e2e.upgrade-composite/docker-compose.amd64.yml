name: zimaos-e2e-upgrade-composite
services:
  web:
    image: traefik/whoami:v1.11.0@sha256:4f90b33ddca9c4d4f06527070d6e503b16d71016edea036842be2a84e60c91cb
    container_name: zimaos-e2e-upgrade-composite-web
    restart: always
    ports:
      - target: 80
        published: '18102'
        protocol: tcp
      - target: 80
        published: '18122'
        protocol: tcp
    environment:
      ZIMAOS_E2E_BASELINE: 20260917080955-49980-update-composite
      E2E_SHARED: upstream-loses
      E2E_LOCAL_DELETE_UPSTREAM_MODIFY: upstream-value
      E2E_LOCAL_EMPTY_UPSTREAM_VALUE: upstream-value
      E2E_LOCAL_VALUE_UPSTREAM_EMPTY: ''
      E2E_BOTH_EMPTY: ''
      E2E_UPSTREAM_ONLY: upstream-value
      E2E_UPSTREAM_ADDED: upstream-value
      E2E_BOTH_ADD_SAME: upstream-loses
      E2E_DIFFERENT_UPSTREAM: upstream-value
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
      - type: bind
        source: /DATA/AppData/zimaos-e2e-upgrade-composite/e2e-upstream
        target: /e2e-upstream
    command:
      - --port=80
      - --name=upstream-composite
  helper:
    image: alpine:3.21@sha256:f27cad9117495d32d067133afff942cb2dc745dfe9163e949f6bfe8a6a245339
    container_name: zimaos-e2e-upgrade-composite-helper
    restart: always
    environment:
      E2E_SECONDARY_BASELINE: 20260917080955-49980-update-composite
      E2E_SECONDARY_UPSTREAM: applied
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
x-casaos:
  id: org.zimaos.e2e.upgrade-composite
  main: web
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.zimaos.e2e.upgrade-composite/assets/icon.svg
  title:
    en_US: E2E Upgrade Composite
    zh_CN: E2E Upgrade Composite
  port_map: '18102'
  version: 1.1.0
