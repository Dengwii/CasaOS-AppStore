name: zimaos-e2e-image-composite-main
services:
  web:
    image: traefik/whoami:latest@sha256:80f8bb74f634d45d55967820a702c5fddf01cf92968bb29ed7a3573dd16b0e55
    container_name: zimaos-e2e-image-composite-main-web
    restart: unless-stopped
    ports:
      - target: 80
        published: '18107'
        protocol: tcp
    environment:
      ZIMAOS_E2E_BASELINE: 20260920121320-814225-image-composite-main
      E2E_SHARED: baseline
      E2E_LOCAL_DELETE_UPSTREAM_MODIFY: baseline
      E2E_LOCAL_KEEP_UPSTREAM_DELETE: baseline
      E2E_LOCAL_EMPTY_UPSTREAM_VALUE: baseline
      E2E_LOCAL_VALUE_UPSTREAM_EMPTY: baseline
      E2E_BOTH_EMPTY: baseline
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
  helper:
    image: alpine:latest@sha256:d56c381f961d307a21b3ca004cf1e3910f106644aefb1f43e654c8a56c4fd395
    container_name: zimaos-e2e-image-composite-main-helper
    restart: unless-stopped
    environment:
      E2E_SECONDARY_BASELINE: 20260920121320-814225-image-composite-main
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
x-casaos:
  id: org.zimaos.e2e.image-composite-main
  main: web
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.zimaos.e2e.image-composite-main/assets/icon.svg
  title:
    en_US: E2E Image Composite Main Only
    zh_CN: E2E Image Composite Main Only
  port_map: '18107'
  version: 1.0.0
  scheme: http
  index: /
