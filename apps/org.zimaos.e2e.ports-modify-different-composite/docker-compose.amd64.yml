name: zimaos-e2e-ports-modify-different-composite
services:
  web:
    image: traefik/whoami:v1.10.3@sha256:c899811bc4a1f63a1273c612e15f1bea6514a19c7b08143dbbdef3e8f882c38d
    container_name: zimaos-e2e-ports-modify-different-composite-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260917133559-110860-update-ports-modify-different-composite
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
    ports:
      - target: 10016
        published: '30032'
        protocol: tcp
      - target: 10017
        published: '30033'
        protocol: tcp
  helper:
    image: alpine:3.20@sha256:c64c687cbea9300178b30c95835354e34c4e4febc4badfe27102879de0483b5e
    container_name: zimaos-e2e-ports-modify-different-composite-helper
    network_mode: bridge
    restart: unless-stopped
    environment:
      E2E_SECONDARY_BASELINE: 20260917133559-110860-update-ports-modify-different-composite
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
x-casaos:
  id: org.zimaos.e2e.ports-modify-different-composite
  main: web
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.zimaos.e2e.ports-modify-different-composite/assets/icon.svg
  title:
    en_US: E2E Ports Modify-Different Composite
    zh_CN: E2E Ports Modify-Different Composite
  port_map: '18208'
  version: 1.0.0
