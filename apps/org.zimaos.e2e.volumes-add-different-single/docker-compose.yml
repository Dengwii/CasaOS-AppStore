    image: traefik/whoami:v1.11.0
    container_name: zimaos-e2e-volumes-add-different-single-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260918050619-305930-update-volumes-add-different-single
    restart: unless-stopped
    ports:
      - target: 80
        published: '18203'
        protocol: tcp
    command:
      - --port=80
    volumes:
      - type: bind
        source: /DATA/AppData/zimaos-e2e-volumes-add-different-single/case-upstream-b
        target: /e2e-case-b
