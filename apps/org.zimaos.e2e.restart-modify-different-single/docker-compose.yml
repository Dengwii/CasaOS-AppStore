name: zimaos-e2e-restart-modify-different-single
services:
  web:
    image: traefik/whoami:v1.10.3
    container_name: zimaos-e2e-restart-modify-different-single-web
    environment:
      ZIMAOS_E2E_BASELINE: 20260917110228-81839-update-restart-modify-different-single
    ports:
      - target: 80
        published: '18271'
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
    restart: unless-stopped
x-casaos:
