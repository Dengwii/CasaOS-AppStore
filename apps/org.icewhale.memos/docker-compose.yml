name: dengwii-memos-cross-source
services:
  memos:
    environment:
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
    image: neosmemo/memos:0.28.0
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: bridge
    ports:
      - target: 5230
        published: "5230"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/dengwii-memos-cross-source/memos
        target: /var/opt/memos
    container_name: dengwii-memos-cross-source
x-casaos:
  id: org.icewhale.memos
  main: memos
  icon: https://raw.githubusercontent.com/Dengwii/CasaOS-AppStore/gh-pages/apps/org.icewhale.memos/assets/icon.svg
  title:
    en_US: Memos
  port_map: "5230"
