name: memos
services:
  memos:
    environment:
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
    image: neosmemo/memos:0.30.0@sha256:ce346ef5ff684aa81f0cfab8a216ace7a54b78164c95ba9c4e4623a13808aba9
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: bridge
    ports:
      - target: 5230
        published: "5230"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/memos/memos
        target: /var/opt/memos
    container_name: memos
x-casaos:
  id: org.icewhale.memos
  main: memos
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.icewhale.memos/assets/icon.svg
  title:
    en_US: Memos
  port_map: "5230"
  version: "0.30.0"
