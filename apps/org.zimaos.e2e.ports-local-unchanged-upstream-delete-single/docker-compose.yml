name: zimaos-e2e-ports-local-unchanged-upstream-delete-single
services:
  web:
    image: traefik/whoami:v1.10.3
    container_name: zimaos-e2e-ports-local-unchanged-upstream-delete-single-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260917131350-106610-update-ports-local-unchanged-upstream-delete-single
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
    ports:
      - target: 10026
        published: '30052'
        protocol: tcp
x-casaos:
  id: org.zimaos.e2e.ports-local-unchanged-upstream-delete-single
  main: web
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.zimaos.e2e.ports-local-unchanged-upstream-delete-single/assets/icon.svg
  title:
    en_US: E2E Ports Local-Unchanged-Upstream-Delete Single
    zh_CN: E2E Ports Local-Unchanged-Upstream-Delete Single
  port_map: '18213'
  version: 1.0.0
