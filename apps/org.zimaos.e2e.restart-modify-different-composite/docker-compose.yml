name: zimaos-e2e-restart-modify-different-composite
services:
  web:
    image: traefik/whoami:v1.10.3
    container_name: zimaos-e2e-restart-modify-different-composite-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260917212707-222382-update-restart-modify-different-composite
    ports:
      - target: 80
        published: '18208'
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
    restart: unless-stopped
  helper:
    image: alpine:3.20
    container_name: zimaos-e2e-restart-modify-different-composite-helper
    network_mode: bridge
    restart: unless-stopped
    environment:
      E2E_SECONDARY_BASELINE: 20260917212707-222382-update-restart-modify-different-composite
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
x-casaos:
  id: org.zimaos.e2e.restart-modify-different-composite
  main: web
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.zimaos.e2e.restart-modify-different-composite/assets/icon.svg
  title:
    en_US: E2E Restart Modify-Different Composite
    zh_CN: E2E Restart Modify-Different Composite
  port_map: '18208'
  version: 1.0.0
