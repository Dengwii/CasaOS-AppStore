name: zimaos-e2e-restart-local-delete-upstream-modify-composite
services:
  web:
    image: traefik/whoami:v1.11.0
    container_name: zimaos-e2e-restart-local-delete-upstream-modify-composite-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260918063303-327707-update-restart-local-delete-upstream-modify-composite
    ports:
      - target: 80
        published: '18212'
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
    restart: always
  helper:
    image: alpine:3.20
    container_name: zimaos-e2e-restart-local-delete-upstream-modify-composite-helper
    network_mode: bridge
    restart: unless-stopped
    environment:
      E2E_SECONDARY_BASELINE: 20260918063303-327707-update-restart-local-delete-upstream-modify-composite
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
x-casaos:
  id: org.zimaos.e2e.restart-local-delete-upstream-modify-composite
  main: web
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.zimaos.e2e.restart-local-delete-upstream-modify-composite/assets/icon.svg
  title:
    en_US: E2E Restart Local-Delete-Upstream-Modify Composite
    zh_CN: E2E Restart Local-Delete-Upstream-Modify Composite
  port_map: '18212'
  version: 1.1.0
