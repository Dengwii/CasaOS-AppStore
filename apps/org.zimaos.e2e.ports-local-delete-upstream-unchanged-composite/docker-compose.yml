name: zimaos-e2e-ports-local-delete-upstream-unchanged-composite
services:
  web:
    image: traefik/whoami:v1.10.3
    container_name: zimaos-e2e-ports-local-delete-upstream-unchanged-composite-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260918042316-295345-update-ports-local-delete-upstream-unchanged-composite
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
    ports:
      - target: 10032
        published: '30064'
        protocol: tcp
  helper:
    image: alpine:3.20
    container_name: zimaos-e2e-ports-local-delete-upstream-unchanged-composite-helper
    network_mode: bridge
    restart: unless-stopped
    environment:
      E2E_SECONDARY_BASELINE: 20260918042316-295345-update-ports-local-delete-upstream-unchanged-composite
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
x-casaos:
  id: org.zimaos.e2e.ports-local-delete-upstream-unchanged-composite
  main: web
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.zimaos.e2e.ports-local-delete-upstream-unchanged-composite/assets/icon.svg
  title:
    en_US: E2E Ports Local-Delete-Upstream-Unchanged Composite
    zh_CN: E2E Ports Local-Delete-Upstream-Unchanged Composite
  port_map: '18216'
  version: 1.0.0
