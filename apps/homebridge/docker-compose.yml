name: homebridge
version: '2'
services:
  homebridge:
    image: homebridge/homebridge@sha256:0cf91b4607b398c146b80b12c1b6c45c049396af5f2d95726e06fb0a06ff7f47
    restart: always
    network_mode: host
    volumes:
    - /DATA/AppData/$AppID/config:/homebridge
    logging:
      driver: json-file
      options:
        max-size: 10mb
        max-file: '1'
x-casaos:
  main: homebridge
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/homebridge/assets/icon.png
  title:
    en_US: Homebridge
  index: /
  port_map: '8581'
  version: latest
