name: prowlarr
services:
  prowlarr:
    environment:
      PGID: "1000"
      PUID: "1000"
      TZ: Europe/London
    image: linuxserver/prowlarr:2.5.2@sha256:20ac4a451d4526b0f1be9f474210eb98541384e64596c3cf5eb76787b251afb4
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: bridge
    ports:
      - target: 9696
        published: "9696"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/prowlarr/config
        target: /config
    container_name: prowlarr
x-casaos:
  id: org.icewhale.prowlarr
  main: prowlarr
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.icewhale.prowlarr/assets/icon.svg
  title:
    en_US: Prowlarr
  port_map: "9696"
  version: "2.5.2"
