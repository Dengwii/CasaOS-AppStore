name: lucky
services:
  lucky:
    deploy:
      resources:
        reservations:
          memory: 64M
    image: gdy666/lucky:3.0.0@sha256:d1ddbbdde31bca266662767954a05d9a973aba12346f6bbbaa6257ed3e9c50c0
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/lucky
        target: /goodluck
