  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.icewhale.lucky/assets/icon.svg
  index: /
  title:
    en_US: Lucky
  port_map: "16601"
  scheme: http
  version: "3.0.0"
