name: zimaos-e2e-legacy-unmanaged-environment-local-unchanged-upstream-add-composite-main-to-main
services:
  web:
    image: traefik/whoami:v1.10.3
    container_name: zimaos-e2e-legacy-unmanaged-environment-local-unchanged-upstream-add-composite-main-to-main-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260921171621-1205145-update-legacy-unmanaged-environment-local-unchanged-upstream-add-composite-main-to-main
      E2E_CASE_014_MAIN_A: baseline-a
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    ports:
      - target: 80
        published: '18214'
        protocol: tcp
    restart: unless-stopped
    command:
      - --port=80
  helper:
    image: alpine:3.20
    container_name: zimaos-e2e-legacy-unmanaged-environment-local-unchanged-upstream-add-composite-main-to-main-helper
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260921171621-1205145-update-legacy-unmanaged-environment-local-unchanged-upstream-add-composite-main-to-main-helper
      E2E_CASE_014_HELPER_A: baseline-a
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base-helper
        target: /e2e-base-helper
    restart: unless-stopped
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
