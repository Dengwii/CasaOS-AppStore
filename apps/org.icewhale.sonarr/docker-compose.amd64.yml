name: sonarr
services:
  sonarr:
    environment:
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
    image: linuxserver/sonarr:4.0.19@sha256:580d419a949e9afadcf00cc33e38747f795ac162f20649649464b6640a5e971d
    deploy:
      resources:
        reservations:
          memory: "256M"
    network_mode: bridge
    ports:
      - target: 8989
        published: "8989"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/Media/TV Shows
        target: /tv
      - type: bind
        source: /DATA/Downloads
        target: /downloads
    container_name: sonarr
x-casaos:
  id: org.icewhale.sonarr
  main: sonarr
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.icewhale.sonarr/assets/icon.svg
  title:
    en_US: Sonarr
  index: /
  port_map: "8989"
  version: "4.0.19"
