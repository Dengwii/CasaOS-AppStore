name: zimaos-e2e-native-composite-cross-command-add-same-composite-helper-to-helper
services:
  web:
    image: traefik/whoami:v1.11.0
    container_name: zimaos-e2e-native-composite-cross-command-add-same-composite-helper-to-helper-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260923205535-1808238-update-native-composite-cross-command-add-same-composite-helper-to-helper
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    ports:
      - target: 80
        published: '18671'
        protocol: tcp
    restart: unless-stopped
  helper:
    image: traefik/whoami:v1.10.3
    container_name: zimaos-e2e-native-composite-cross-command-add-same-composite-helper-to-helper-helper
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260923205535-1808238-update-native-composite-cross-command-add-same-composite-helper-to-helper-helper
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base-helper
        target: /e2e-base-helper
    restart: unless-stopped
    command:
      - --port=80
      - --name=same-helper
