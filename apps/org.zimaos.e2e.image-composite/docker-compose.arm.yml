name: zimaos-e2e-image-composite
services:
  web:
    image: traefik/whoami:latest@sha256:7752820e8169b4ce86b8a8613b0cf401bd021928647a8e0fdf37d713920a7645
    container_name: zimaos-e2e-image-composite-web
    restart: always
    ports:
      - target: 80
        published: '18106'
        protocol: tcp
    environment:
      ZIMAOS_E2E_BASELINE: 20261001134601-892902-image-composite
      E2E_SHARED: upstream-loses
      E2E_LOCAL_DELETE_UPSTREAM_MODIFY: upstream-value
      E2E_LOCAL_EMPTY_UPSTREAM_VALUE: upstream-value
      E2E_LOCAL_VALUE_UPSTREAM_EMPTY: ''
      E2E_BOTH_EMPTY: ''
      E2E_UPSTREAM_ADDED: upstream-value
      E2E_BOTH_ADD_SAME: upstream-loses
      E2E_DIFFERENT_UPSTREAM: upstream-value
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
  helper:
    image: alpine:latest@sha256:d3c3fda3e4d3f0fcfc86cf469c6dfbe65017143dde23feb4b11df37c373cdc76
    container_name: zimaos-e2e-image-composite-helper
    restart: always
    environment:
      E2E_SECONDARY_BASELINE: 20261001134601-892902-image-composite
      E2E_SECONDARY_UPSTREAM: applied
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
x-casaos:
  id: org.zimaos.e2e.image-composite
  main: web
  icon: https://raw.githubusercontent.com/Dengwii/CasaOS-AppStore/refs/heads/gh-pages/apps/org.zimaos.e2e.image-composite/assets/icon.svg
  title:
    en_US: E2E Image Composite
    zh_CN: E2E Image Composite
  port_map: '18106'
  version: 1.0.0
  scheme: http
  index: /
