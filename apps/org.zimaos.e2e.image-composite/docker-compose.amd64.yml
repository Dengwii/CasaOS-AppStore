name: zimaos-e2e-image-composite
services:
  web:
    image: traefik/whoami:latest@sha256:80f8bb74f634d45d55967820a702c5fddf01cf92968bb29ed7a3573dd16b0e55
    container_name: zimaos-e2e-image-composite-web
    restart: unless-stopped
    ports:
      - target: 80
        published: '18106'
        protocol: tcp
    environment:
      ZIMAOS_E2E_BASELINE: 20260917071020-40176-image-composite
      E2E_SHARED: baseline
      E2E_LOCAL_DELETE_UPSTREAM_MODIFY: baseline
      E2E_LOCAL_KEEP_UPSTREAM_DELETE: baseline
      E2E_LOCAL_EMPTY_UPSTREAM_VALUE: baseline
      E2E_LOCAL_VALUE_UPSTREAM_EMPTY: baseline
      E2E_BOTH_EMPTY: baseline
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
  helper:
    image: alpine:latest@sha256:79ff19e9084a00eece421b2523fb93e22d730e2c0e525905de047e848e56d95f
    container_name: zimaos-e2e-image-composite-helper
    restart: unless-stopped
    environment:
      E2E_SECONDARY_BASELINE: 20260917071020-40176-image-composite
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
x-casaos:
  id: org.zimaos.e2e.image-composite
  main: web
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.zimaos.e2e.image-composite/assets/icon.svg
  title:
    en_US: E2E Image Composite
    zh_CN: E2E Image Composite
  port_map: '18106'
  version: 1.0.0
