name: zimaos-e2e-image-composite
services:
  web:
    image: traefik/whoami:latest@sha256:fb8458a97e9695115b0367e5ecf2a1a72de48b306acccccd01455b46334d2300
    container_name: zimaos-e2e-image-composite-web
    restart: unless-stopped
    ports:
      - target: 80
        published: '18106'
        protocol: tcp
    environment:
      ZIMAOS_E2E_BASELINE: 20260917222219-233780-image-composite
      E2E_SHARED: baseline
      E2E_LOCAL_DELETE_UPSTREAM_MODIFY: baseline
      E2E_LOCAL_KEEP_UPSTREAM_DELETE: baseline
      E2E_LOCAL_EMPTY_UPSTREAM_VALUE: baseline
      E2E_LOCAL_VALUE_UPSTREAM_EMPTY: baseline
      E2E_BOTH_EMPTY: baseline
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/e2e-base
        target: /e2e-base
    command:
      - --port=80
  helper:
    image: alpine:latest@sha256:e7a1a92a5bfeee40966aea60f0796b0e7917cc35591542701834f03a68fa3d18
    container_name: zimaos-e2e-image-composite-helper
    restart: unless-stopped
    environment:
      E2E_SECONDARY_BASELINE: 20260917222219-233780-image-composite
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
x-casaos:
  id: org.zimaos.e2e.image-composite
  main: web
  icon: https://cdn.jsdelivr.net/gh/Dengwii/CasaOS-AppStore@gh-pages/apps/org.zimaos.e2e.image-composite/assets/icon.svg
  title:
    en_US: E2E Image Composite
    zh_CN: E2E Image Composite
  port_map: '18106'
  version: 1.0.0
