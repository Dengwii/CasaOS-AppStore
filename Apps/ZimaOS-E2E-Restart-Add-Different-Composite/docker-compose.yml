name: zimaos-e2e-restart-add-different-composite
services:
  web:
    image: traefik/whoami:v1.10.3
    container_name: zimaos-e2e-restart-add-different-composite-web
    network_mode: bridge
    environment:
      ZIMAOS_E2E_BASELINE: 20260918063303-327707-update-restart-add-different-composite
    ports:
    - target: 80
      published: '18204'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/e2e-base
      target: /e2e-base
    command:
    - --port=80
  helper:
    image: alpine:3.20
    container_name: zimaos-e2e-restart-add-different-composite-helper
    network_mode: bridge
    restart: unless-stopped
    environment:
      E2E_SECONDARY_BASELINE: 20260918063303-327707-update-restart-add-different-composite
    command:
    - sh
    - -c
    - while true; do sleep 3600; done
