name: zimaos-e2e-upgrade-single
services:
  web:
    image: traefik/whoami:v1.11.0
    container_name: zimaos-e2e-upgrade-single-web
    restart: always
    ports:
    - target: 80
      published: '18101'
      protocol: tcp
    - target: 80
      published: '18121'
      protocol: tcp
    environment:
      ZIMAOS_E2E_BASELINE: 20260917080955-49980-update-single
      E2E_SHARED: upstream-loses
      E2E_LOCAL_DELETE_UPSTREAM_MODIFY: upstream-value
      E2E_LOCAL_EMPTY_UPSTREAM_VALUE: upstream-value
      E2E_LOCAL_VALUE_UPSTREAM_EMPTY: ''
      E2E_BOTH_EMPTY: ''
      E2E_UPSTREAM_ONLY: upstream-value
      E2E_UPSTREAM_ADDED: upstream-value
      E2E_BOTH_ADD_SAME: upstream-loses
      E2E_DIFFERENT_UPSTREAM: upstream-value
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/e2e-base
      target: /e2e-base
    - type: bind
      source: /DATA/AppData/zimaos-e2e-upgrade-single/e2e-upstream
      target: /e2e-local
    command:
    - --port=80
    - --name=upstream-single
x-casaos:
  id: org.zimaos.e2e.upgrade-single
  architectures:
  - amd64
  - arm
  - arm64
  main: web
  author: Tim Düsterhus
  category: Developer
  description:
    en_US: Adminer (formerly phpMinAdmin) is a full-featured database management tool written in PHP. Conversely to phpMyAdmin, it consist of a single file ready to deploy to the target server. Adminer is available for MySQL, PostgreSQL, SQLite, MS SQL, Oracle, Firebird, SimpleDB, Elasticsearch and MongoDB.
    zh_CN: Adminer（前身为phpMinAdmin）是一个用PHP编写的功能齐全的数据库管理工具。区别于phpMyAdmin，它仅为单个部署到目标服务器的文件（轻量）。Adminer可用于MySQL、PostgreSQL、SQLite、MS SQL、Oracle、Firebird、SimpleDB、Elasticsearch和MongoDB。
