name: zimaos-e2e-native-adminer
services:
  adminer:
    image: adminer:6.0.1
    deploy:
      resources:
        reservations:
          memory: 32M
    restart: always
    ports:
    - target: 8080
      published: '18080'
      protocol: tcp
    - target: 8080
      published: '28080'
      protocol: tcp
    x-casaos:
      ports:
      - container: '8080'
        description:
          en_US: Adminer HTTP Port
          zh_CN: Adminer HTTP 端口
    container_name: zimaos-e2e-native-adminer
    environment:
      ZIMAOS_E2E_BASELINE: 20260916084843-143381-native-adminer-pristine
      E2E_UPSTREAM_ONLY: upstream-value
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/e2e-base
      target: /e2e-base
    - type: bind
      source: /DATA/AppData/zimaos-e2e-native-adminer/e2e-upstream
      target: /e2e-upstream
    command:
    - php
    - -d
    - memory_limit=128M
    - -S
    - '[::]:8080'
    - -t
    - /var/www/html
x-casaos:
  id: org.zimaos.e2e.native-adminer
  architectures:
  - amd64
  - arm
  - arm64
  main: adminer
  author: Tim Düsterhus
  category: Developer
  description:
    en_US: Adminer (formerly phpMinAdmin) is a full-featured database management tool written in PHP. Conversely to phpMyAdmin, it consist of a single file ready to deploy to the target server. Adminer is available for MySQL, PostgreSQL, SQLite, MS SQL, Oracle, Firebird, SimpleDB, Elasticsearch and MongoDB.
    zh_CN: Adminer（前身为phpMinAdmin）是一个用PHP编写的功能齐全的数据库管理工具。区别于phpMyAdmin，它仅为单个部署到目标服务器的文件（轻量）。Adminer可用于MySQL、PostgreSQL、SQLite、MS SQL、Oracle、Firebird、SimpleDB、Elasticsearch和MongoDB。
  developer: Jakub Vrána
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Adminer/icon.svg
